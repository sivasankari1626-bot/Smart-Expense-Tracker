<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <div class="container py-4">
        <h2 class="text-center fw-bold mb-4">💰 Smart Expense Tracker</h2>

        <!-- Top Summary Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card bg-success text-white p-3 shadow-sm">
                    <h5>Total Income</h5>
                    <h3 id="total-income">₹0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-danger text-white p-3 shadow-sm">
                    <h5>Total Expense</h5>
                    <h3 id="total-expense">₹0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-primary text-white p-3 shadow-sm">
                    <h5>Net Balance</h5>
                    <h3 id="net-balance">₹0</h3>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Add Transaction Form -->
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h4 class="mb-3">Add Transaction</h4>
                    <form id="transaction-form">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" id="title" class="form-control" placeholder="e.g. Salary, Rent, Coffee" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount (₹)</label>
                            <input type="number" id="amount" class="form-control" placeholder="e.g. 500" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <select id="type" class="form-select">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" id="category" class="form-control" placeholder="e.g. Food, Salary, Travel" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Add Transaction</button>
                    </form>
                </div>
            </div>

            <!-- Transaction List Table with Bottom Summary -->
            <div class="col-md-7">
                <div class="card p-4 shadow-sm">
                    <h4 class="mb-3">Recent Transactions</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-list">
                                <!-- Dynamic Rows via JS -->
                            </tbody>
                            <tfoot class="table-light fw-bold border-top">
                                <tr>
                                    <td colspan="2" class="text-end">Summary:</td>
                                    <td id="summary-total" colspan="2">In: ₹0 | Out: ₹0</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
